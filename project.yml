name: BoringTracker

options:
  bundleIdPrefix: com.novoselov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The version people see, and the one App Store Connect claims. 1.0 rather
    # than 0.1.0 for the first release: the store has no prerelease channel, so
    # a 0.x on the listing tells everyone who reads it that the developer does
    # not consider the app finished — and this one is finished in the only sense
    # this project recognises, which is that it does what PRODUCT.md says and
    # nothing else. docs/TODO.md already calls the freeze "v1".
    MARKETING_VERSION: "1.0"
    # The build number, and deliberately nothing but a counter. It has to
    # increase for every upload App Store Connect accepts — including a second
    # upload of the same MARKETING_VERSION after a rejection — and it is never
    # shown to anyone, so encoding a date or a commit in it buys nothing and
    # costs a decision each time. Add one. It resets for nobody and means
    # nothing else.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # No DEVELOPMENT_TEAM on purpose: the project must build and run in the
    # simulator for anyone who clones it, with no Apple developer account.
    # A device build needs one, so it comes from an untracked
    # Config/Local.xcconfig picked up by Config/Signing.xcconfig below —
    # present on a machine that installs to hardware, absent everywhere else.

# In a folder rather than at the repo root, and that is the whole fix for the
# `TEMP_…` uuid churn this project used to regenerate. With
# createIntermediateGroups on, a config file sitting beside project.yml makes
# XcodeGen build a group for the *containing directory* to hold it — a group
# named after whatever the clone happens to be called, and one whose reference
# never gets a deterministic id, so it and the file both came out as fresh
# `TEMP_<random uuid>` every run and five lines of the committed .xcodeproj
# changed for nothing. Any subdirectory ends it: the group is `Config`, the ids
# hash from the path, and two regenerates in a row are byte-identical.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

targets:
  BoringTracker:
    type: application
    platform: iOS
    sources:
      - path: BoringTracker
    settings:
      base:
        # Permanent: changing this after shipping makes it a different app
        # that existing users never get updates for.
        PRODUCT_BUNDLE_IDENTIFIER: com.novoselov.boringtracker
        # The product name stays one word so paths (and the test host) have no
        # spaces in them; the home screen shows CFBundleDisplayName.
        PRODUCT_NAME: BoringTracker
        GENERATE_INFOPLIST_FILE: YES
        # Empty on purpose. The asset catalog exists for one colour set
        # (docs/TODO.md item 18) and has no `AppIcon` set in it, which is a
        # hard build error while this defaults to "AppIcon" — the icon is the
        # other half of item 18 and a design decision the user has not made.
        # Set this to AppIcon when there is an icon to point it at.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Home screen labels truncate around 12 characters, so the icon says
        # "Boring" while the App Store listing is "Boring Tracker".
        INFOPLIST_KEY_CFBundleDisplayName: Boring
        # Export compliance, answered here so App Store Connect stops asking on
        # every upload. The app uses no encryption of its own and makes no
        # network connection at all (docs/PHILOSOPHY.md rule 4), so the answer
        # is NO and stays NO. On the target rather than the project because the
        # test bundle is not uploaded to anything. See docs/SHIPPING.md.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Scoped to the simulator only. Unconditional NO also blocks device
        # builds, which must be signed; the simulator needs no signature, so
        # keeping it off there preserves the no-account clone-and-run path.
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO

  BoringTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoringTrackerTests
    dependencies:
      - target: BoringTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novoselov.boringtracker.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BoringTracker:
    build:
      targets:
        BoringTracker: all
        BoringTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BoringTrackerTests
